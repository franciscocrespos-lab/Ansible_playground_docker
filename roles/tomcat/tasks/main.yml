---
# This is the entry point for the role

- name: Run preinstall tasks
  include_tasks: ../roles/tomcat/tasks/preinstall.yml

# Starting to Install Tomcat

- name: downloading tomcat packages
  get_url:
    url: "{{ tomcat_url_tar_gz}}"
    dest: /opt
    mode: 0755

- name: extract package
  unarchive:
    src: /opt/{{tomcat_version}}.tar.gz
    dest: /opt
    remote_src: yes

- name: change permission on apache-tomcat directory
  file:
    path: /opt/{{ tomcat_version }}
    mode: 0755
    recurse: yes

- name: create link file for tomcat installation
  file:
    src: /opt/{{ tomcat_version }}
    dest: "{{ tomcat_home_path }}"
    state: link

