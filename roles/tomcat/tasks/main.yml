- name: Fix users for Tomcat
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0755'
    backup: yes
  loop: "{{ config_files }}"


- name: create link file for tomcat startup.sh
  file:
    src: "{{ tomcat_home_path }}/bin/{{ item.tomcat_script }}"
    dest: /usr/local/bin/{{ item.tomcat_comand }}
    state: link
  loop:
    - { tomcat_script: 'startup.sh', tomcat_comand: tomcatup }
    - { tomcat_script: 'shutdown.sh', tomcat_comand: tomcatdown }

- name: deploy war file
  copy:
    src: "{{ artifactory_path }}/{{ item.app }}"
    dest: "{{ tomcat_home_path }}/webapps/{{ item.app }}"
  loop: "{{ artifactories }}"
  notify: restart tomcat







  notify: start tomcat