[defaults]
# Paths for roles and collections
roles_path = roles
collections_paths = collections

# Python interpreter on remote hosts
interpreter_python = /usr/bin/python3

# Inventory file
inventory = inventory/dev/hosts.ini

# Host and group variable directories
host_vars_inventory = host_vars
group_vars_inventory = group_vars

# SSH defaults
remote_user = ansible
become = true
become_method = sudo

# Enable automatic installation of Python module dependencies (like python3-apt)
auto_install_module_deps = true

# Logging and verbosity
verbosity = 2
retry_files_enabled = False
deprecation_warnings = False
timeout = 30
host_key_checking = False

# Strategy and forks
# linear strategy is default; forks allow parallelism
strategy = linear
forks = 10

# Enable pipelining for faster SSH connections
pipelining = True

[persistent_connection]
# Controls idle time for persistent SSH connections
connect_timeout = 30
command_timeout = 30
persistent_timeout = 60

[ssh_connection]
# Reduce connection overhead
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
control_path = %(directory)s/%%h-%%r
