---
- name: Setup basic tools on all playground servers
  hosts: playground
  become: yes  # run with sudo
  tasks:
    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages to the latest version
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Install essential tools
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - tree
        state: present

